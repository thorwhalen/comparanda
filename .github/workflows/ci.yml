name: CI

on:
  push:
    branches: [main]
  pull_request:

# No publish job yet. CI's job at this stage is to protect the code, not to
# release it; a publish step needs an npm token nobody has set, and a red CI on
# every push teaches people to ignore it.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Module boundaries
        # ADR-0005 makes the core/view isolation a condition of its own
        # acceptance, and ADR-0013 says one stray fetch() in a renderer breaks
        # the standalone bundle -- and only offline, so it ships green.
        run: pnpm lint:boundaries

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Packed tarball resolves (publint, arethetypeswrong)
        # Packs the tarball npm would publish and checks that every subpath in
        # the exports map resolves to JavaScript AND to types, for ESM and CJS
        # consumers alike. The exports map is otherwise only ever exercised by
        # the first person to install the package. Profile node16: the
        # `engines` floor is Node 20, so node10 resolution (which cannot read
        # subpath exports at all) is ignored rather than papered over.
        run: pnpm lint:package

      - name: Core bundle contains no view code
        # The static check above runs again against the real build, where the
        # metafile can be read. This is the half that actually proves it.
        run: pnpm lint:boundaries

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No NUL bytes in tracked files
        # This step guards the two steps below it, and it exists because they
        # silently failed to guard anything.
        #
        # Both use `grep -rI`, where -I means "skip binary files", and grep
        # calls a file binary the moment it contains a NUL byte.
        # src/core/schema/analysis.ts -- the package's principal export --
        # carried two literal NUL characters in a template literal where the
        # sibling function used the \u0000 escape. It was therefore skipped by
        # the absolute-path scan AND by the ADR-0016 denylist, which is a hard
        # constraint, for as long as it had been there. Both steps reported
        # success the whole time.
        #
        # Dropping -I is not the fix: the scans would then read real binaries
        # and emit noise. The fix is that nothing goes binary silently. The
        # allowlist is empty on purpose -- this repository has no committed
        # binaries, and adding one should be a deliberate edit here rather than
        # a file that quietly stops being scanned.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess, sys

          ALLOW: set[str] = set()   # deliberately empty; see the comment above

          files = subprocess.run(
              ['git', 'ls-files', '-z'], capture_output=True, check=True
          ).stdout.split(b'\0')

          offenders = []
          for raw in files:
              if not raw:
                  continue
              name = raw.decode('utf-8', 'surrogateescape')
              if name in ALLOW:
                  continue
              try:
                  with open(raw, 'rb') as fh:
                      if b'\0' in fh.read():
                          offenders.append(name)
              except (IsADirectoryError, FileNotFoundError):
                  pass

          if offenders:
              print('::error::NUL byte in a tracked file. `grep -I` skips it, so the '
                    'absolute-path scan and the ADR-0016 denylist below would pass '
                    'without ever reading it.')
              print('::error::In source, write the \\u0000 escape instead of a literal NUL.')
              for o in offenders:
                  print(f'  {o}')
              sys.exit(1)

          print(f'no NUL bytes in {sum(1 for f in files if f)} tracked files; '
                'the scans below can read everything')
          PY

      - name: No absolute local paths or personal identifiers
        # This repository is public and much of its documentation was generated.
        # A leaked home directory is the most likely way something local escapes.
        run: |
          set -euo pipefail
          if grep -rIn -E '/Users/[a-z]|/home/[a-z]|/root/[a-z]' \
               --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist . ; then
            echo "::error::absolute local path found; see the note in CLAUDE.md on public-repo hygiene"
            exit 1
          fi
          echo "no absolute local paths anywhere in the tree"
